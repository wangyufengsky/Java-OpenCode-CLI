<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('新建运行')}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('new-run')}"></aside>
  <main class="app-main">
    <header th:replace="~{fragments/layout :: pageHeader('运行管理', '新建运行', '选择工作流、填写所需参数，并在提交前完成路径预检。')}"></header>
    <div class="page-content new-run-page">
      <section class="c-step-navigation" aria-label="创建运行步骤">
        <article class="is-active" data-step="1"><span>步骤 1</span><strong>选择工作流</strong></article>
        <article data-step="2"><span>步骤 2</span><strong>填写配置</strong></article>
        <article data-step="3"><span>步骤 3</span><strong>确认并运行</strong></article>
      </section>

      <form id="run-form" class="run-form" novalidate aria-busy="false"
            th:attr="data-selected-chain=${chainId},data-selected-mode=${selectedMode},data-selected-rerun-type=${selectedRerunType},data-selected-rerun-id=${selectedRerunId},data-selected-run-date=${selectedRunDate},data-copy-from=${copiedRun == null ? null : copiedRun.id}">
        <section class="panel form-main c-form-section">
          <div class="copy-banner" th:if="${copiedRun != null}" role="status">
            <strong th:text="${'复制自运行 #' + copiedRun.id}">复制自运行 #1</strong>
            <span>正在载入原运行配置；链路默认值会先行保留。</span>
          </div>
          <p id="copy-load-status" class="form-message" role="status" aria-live="polite"></p>
          <p id="preflight-alert" class="form-message alert c-alert" data-tone="neutral" role="status" aria-live="polite"></p>
          <p id="submit-result" class="form-message alert c-alert danger" data-field-error="true" role="alert" aria-live="polite"></p>

          <section aria-labelledby="workflow-title">
            <div class="panel-title">
              <div>
                <h2 id="workflow-title">选择工作流</h2>
                <p class="muted">切换工作流会载入对应默认配置，不会改写资源文件。</p>
              </div>
            </div>
            <div id="workflow-cards" class="chain-list">
              <a th:each="chain : ${chains}" th:href="@{/runs/new(chainId=${chain})}"
                 th:attr="data-chain-card=${chain},aria-current=${chain == chainId ? 'true' : null}">
                <strong th:text="${@consoleText.chain(chain)}">工作流</strong>
                <span th:text="${chain}">chain-id</span>
              </a>
            </div>
            <label class="visually-hidden" for="chainId">工作流标识
              <select id="chainId" name="chainId">
                <option th:each="chain : ${chains}" th:value="${chain}" th:text="${@consoleText.chain(chain)}" th:selected="${chain == chainId}">链路</option>
              </select>
            </label>
          </section>

          <details class="config-editor config-group run-mode-group">
            <summary class="panel-title">
              <div>
                <h2 id="execution-title">运行方式</h2>
                <p class="muted">重跑参数沿用现有链路契约；仅需要编号的类型会启用编号输入。</p>
              </div>
            </summary>
            <div class="form-row">
              <label for="mode">模式
                <select id="mode" name="mode">
                  <option value="full" th:selected="${selectedMode == 'full'}">全量</option>
                  <option value="rerun" th:selected="${selectedMode == 'rerun'}">重跑</option>
                </select>
              </label>
              <label for="rerunType">重跑类型
                <select id="rerunType" name="rerunType">
                  <option th:each="type : ${rerunTypes}" th:value="${type.value()}" th:text="${type.label()}"
                          th:selected="${type.value() == selectedRerunType}">重跑类型</option>
                </select>
              </label>
              <label for="rerunId">重跑编号
                <input id="rerunId" name="rerunId" placeholder="多个编号用英文逗号分隔" th:value="${selectedRerunId}">
                <small id="rerunId-validation" class="form-message" aria-live="polite"></small>
              </label>
              <label for="runDate">运行日期
                <input id="runDate" name="runDate" type="date" th:value="${selectedRunDate}">
              </label>
            </div>
          </details>

          <section class="config-editor" aria-labelledby="chain-config-title">
            <div class="panel-title">
              <div>
                <h2 id="chain-config-title">链路配置</h2>
                <p id="chain-config-description"></p>
              </div>
            </div>
            <div id="chain-config-fields"></div>
          </section>
        </section>

        <aside class="panel submit-panel c-run-summary">
          <div class="summary-header">
            <h2>运行摘要</h2>
            <span id="summary-ready" class="status-badge queued">配置中</span>
          </div>
          <div id="run-summary" class="summary-items">
            <div class="summary-item"><span>工作流</span><strong id="summary-chain">-</strong></div>
            <div class="summary-item"><span>项目</span><strong id="summary-project">-</strong></div>
            <div class="summary-item"><span>代码范围</span><strong id="summary-scope">-</strong></div>
            <div class="summary-item"><span>验证策略</span><strong id="summary-validation">失败即停止</strong></div>
            <div class="summary-item"><span>AgentBridge</span><strong id="summary-agentbridge">自动重连 · 增量事件恢复</strong></div>
            <div class="summary-item"><span>输出目录</span><strong id="summary-output">-</strong></div>
          </div>
          <div class="summary-spacer"></div>
          <div class="summary-submission-note">
            <strong>提交后将创建 1 次运行</strong>
            <span>运行开始后可在详情页查看阶段进度与实时事件。</span>
          </div>
          <div class="summary-actions">
            <a class="button c-button" href="#chain-config-title">预览配置</a>
            <button id="submit-run" class="button c-button primary" type="submit">确认并运行</button>
          </div>
        </aside>
      </form>
    </div>
  </main>
</div>
<script src="/js/console-common.js?v=20260722-mybatis-sql-review"></script>
<script src="/js/run-form.js?v=20260720-figma-summary"></script>
</body>
</html>
