<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('配置运行')}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('new-run')}"></aside>
  <main class="app-main">
    <header th:replace="~{fragments/layout :: pageHeader('运行管理', '配置运行', '按链路填写结构化配置；资源配置文件不会被改写。')}"></header>
    <div class="page-content">

    <form id="run-form" class="run-form" th:attr="data-selected-chain=${chainId}">
    <section class="panel form-main">
      <label for="chainId">链路</label>
      <select id="chainId" name="chainId">
        <option th:each="chain : ${chains}" th:value="${chain}" th:text="${@consoleText.chain(chain)}" th:selected="${chain == chainId}">链路</option>
      </select>

      <div class="form-row">
        <label for="mode">模式
          <select id="mode" name="mode">
            <option value="full">全量</option>
            <option value="rerun">重跑</option>
          </select>
        </label>
        <label for="rerunType">重跑类型
          <select id="rerunType" name="rerunType">
            <option th:each="type : ${rerunTypes}" th:value="${type.value()}" th:text="${type.label()}">重跑类型</option>
          </select>
        </label>
        <label for="rerunId">重跑编号
          <input id="rerunId" name="rerunId" placeholder="多个编号用英文逗号分隔">
        </label>
        <label for="runDate">运行日期
          <input id="runDate" name="runDate" type="date">
        </label>
      </div>

      <section class="config-editor" aria-labelledby="chain-config-title">
        <div class="panel-title">
          <div>
            <h2 id="chain-config-title">链路配置</h2>
            <p id="chain-config-description"></p>
          </div>
        </div>
        <div id="chain-config-fields" class="config-fields"></div>
      </section>
    </section>

    <aside class="panel submit-panel">
      <h2>提交校验</h2>
      <ul>
        <li>链路必须存在</li>
        <li>模式必须是全量或重跑</li>
        <li>重跑类型按链路选择，明细重跑才需要编号</li>
        <li>链路字段来自当前页面默认值</li>
        <li>运行时设置只覆盖连接、并发和超时等共享参数</li>
        <li>提交后生成本次运行配置，不改资源配置</li>
      </ul>
      <button class="button primary" type="submit">提交运行</button>
      <p id="submit-result" class="form-message"></p>
    </aside>
    </form>
    </div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
