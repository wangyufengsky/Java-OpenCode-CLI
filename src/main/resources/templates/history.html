<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('运行历史')}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('history')}"></aside>
  <main class="app-main">
    <header th:replace="~{fragments/layout :: pageHeader('运行管理', '运行历史', '基于 SQLite 保存的工作流运行归档。')}"></header>
    <div class="page-content">
    <section class="panel">
    <table>
      <thead><tr><th>编号</th><th>链路</th><th>模式</th><th>重跑</th><th>状态</th><th>创建时间</th><th>失败原因</th></tr></thead>
      <tbody>
      <tr th:each="run : ${runs}">
        <td><a th:href="@{/runs/{id}(id=${run.id})}" th:text="${run.id}">1</a></td>
        <td th:text="${@consoleText.chain(run.chainId)}">链路</td>
        <td th:text="${@consoleText.mode(run.mode)}">全量</td>
        <td th:text="${@consoleText.rerunType(run.rerunType)}">-</td>
        <td><span class="status-badge" th:classappend="${run.state.name().toLowerCase()}" th:text="${@consoleText.state(run.state)}">排队中</span></td>
        <td th:text="${run.createdAt}">时间</td>
        <td th:text="${run.failureMessage ?: ''}"></td>
      </tr>
      <tr th:if="${runs.isEmpty()}"><td colspan="7" class="empty">暂无运行记录。</td></tr>
      </tbody>
    </table>
    </section>
    </div>
  </main>
</div>
</body>
</html>
