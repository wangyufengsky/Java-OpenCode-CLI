<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('运行历史')}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('history')}"></aside>
  <main class="app-main">
    <header th:replace="~{fragments/layout :: pageHeader('运行管理', '运行历史', '筛选、追踪并复用已保存的工作流运行。')}"></header>
    <div class="page-content history-page">
      <form id="history-filter-form" class="panel history-filter-panel c-filter-control" action="/history" method="get">
        <div class="history-filter-heading">
          <div>
            <p class="page-eyebrow">运行归档</p>
            <h2>查找运行</h2>
            <p class="page-description">按编号、链路、配置路径、状态和创建日期筛选。</p>
          </div>
          <a class="button c-button" th:href="${clearFiltersUrl}">清除筛选</a>
        </div>
        <input type="hidden" name="page" value="1">
        <div class="form-row history-filter-row">
          <label>搜索
            <input type="search" name="q" placeholder="运行编号、链路或配置路径" th:value="${filter.query}">
          </label>
          <label>状态
            <select name="state">
              <option value="">全部状态</option>
              <option th:each="candidate : ${runStates}"
                      th:value="${candidate.name()}"
                      th:text="${@consoleText.state(candidate)}"
                      th:selected="${candidate == filter.state}">已失败</option>
            </select>
          </label>
          <label>链路
            <select name="chainId">
              <option value="">全部链路</option>
              <option th:each="candidate : ${chains}"
                      th:value="${candidate}"
                      th:text="${@consoleText.chain(candidate)}"
                      th:selected="${candidate == filter.chainId}">代码贡献报告</option>
            </select>
          </label>
          <label>开始日期
            <input type="date" name="from" th:value="${filter.createdFrom}">
          </label>
          <label>结束日期
            <input type="date" name="until" th:value="${filter.createdUntil}">
          </label>
        </div>
        <div class="history-filter-actions">
          <button class="button c-button primary" type="submit">应用筛选</button>
          <span class="page-description" th:text="|共 ${historyPage.total} 条运行记录|">共 0 条运行记录</span>
        </div>
      </form>

      <section class="panel history-results-panel" aria-labelledby="history-results-title">
        <div class="panel-title history-results-heading">
          <div>
            <h2 id="history-results-title">运行记录</h2>
            <p class="page-description" th:text="|当前第 ${historyPage.page} / ${historyPage.totalPages} 页|">当前第 1 / 1 页</p>
          </div>
          <span class="status-badge c-status-badge" th:text="|每页 ${historyPage.pageSize} 条|">每页 20 条</span>
        </div>

        <div th:if="${historyPage.items.isEmpty()}" class="history-empty-state" role="status">
          <strong>没有符合当前筛选条件的运行</strong>
          <p>调整筛选条件，或清除筛选后查看所有已保存的工作流运行。</p>
          <a class="button c-button" th:href="${clearFiltersUrl}">清除筛选</a>
        </div>

        <div th:if="${!historyPage.items.isEmpty()}" class="table-scroll history-table-scroll" tabindex="0" aria-label="运行记录表格，可横向滚动">
          <table class="history-table">
            <thead><tr><th>编号</th><th>链路</th><th>模式</th><th>状态</th><th>创建时间</th><th>耗时</th><th>失败原因</th><th>操作</th></tr></thead>
            <tbody>
            <tr th:each="run : ${runs}" class="c-table-row">
              <td th:text="${run.id}">1</td>
              <td th:text="${run.chainLabel}">链路</td>
              <td th:text="${run.modeLabel}">全量</td>
              <td><span th:replace="~{fragments/layout :: statusBadge(${run.stateLabel}, ${run.stateTone})}">排队中</span></td>
              <td th:text="${run.createdAtLabel}">时间</td>
              <td th:text="${run.durationLabel}">未开始</td>
              <td th:text="${run.failureMessage.isBlank() ? '—' : run.failureMessage}">—</td>
              <td class="history-actions">
                <a th:href="${historyDetailUrls.get(run.id)}">查看详情</a>
                <span aria-hidden="true"> · </span>
                <a th:href="${historyCopyUrls.get(run.id)}">复制配置</a>
              </td>
            </tr>
            </tbody>
          </table>
        </div>

        <nav class="history-pagination" aria-label="运行历史分页">
          <a th:if="${historyPage.hasPrevious}" class="button c-button" th:href="${previousPageUrl}">上一页</a>
          <span th:unless="${historyPage.hasPrevious}" class="button c-button is-disabled" aria-disabled="true">上一页</span>
          <p th:text="|第 ${historyPage.page} 页，共 ${historyPage.totalPages} 页|">第 1 页，共 1 页</p>
          <a th:if="${historyPage.hasNext}" class="button c-button" th:href="${nextPageUrl}">下一页</a>
          <span th:unless="${historyPage.hasNext}" class="button c-button is-disabled" aria-disabled="true">下一页</span>
        </nav>
      </section>
    </div>
  </main>
</div>
<script src="/js/history.js"></script>
</body>
</html>
