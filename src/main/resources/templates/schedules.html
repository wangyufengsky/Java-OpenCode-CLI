<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('定时任务')}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('schedules')}"></aside>
  <main class="app-main">
    <header th:replace="~{fragments/layout :: pageHeader('运行管理', '定时任务', '按固定时间触发链路运行；触发后进入现有运行队列。')}"></header>
    <div class="page-content">

    <section class="panel schedule-list-panel">
    <div class="panel-title">
      <h2>任务列表</h2>
    </div>
    <table>
      <thead>
      <tr><th>编号</th><th>链路</th><th>频率</th><th>启用</th><th>上次触发</th><th>下次执行</th><th>操作</th></tr>
      </thead>
      <tbody id="schedule-list">
      <tr th:each="schedule : ${schedules}" th:attr="data-schedule-id=${schedule.id}">
        <td th:text="${schedule.id}">1</td>
        <td th:text="${@consoleText.chain(schedule.chainId)}">链路</td>
        <td th:text="${@consoleText.frequency(schedule.frequency.name())}">每天</td>
        <td><span class="status-badge" th:classappend="${schedule.enabled ? 'succeeded' : 'failed'}" th:text="${schedule.enabled ? '启用' : '停用'}">启用</span></td>
        <td th:text="${schedule.lastTriggeredAt ?: '-'}">-</td>
        <td th:text="${schedule.nextTriggerAt ?: '-'}">-</td>
        <td>
          <button class="button schedule-toggle" type="button" th:attr="data-enabled=${!schedule.enabled}" th:text="${schedule.enabled ? '停用' : '启用'}">停用</button>
        </td>
      </tr>
      <tr th:if="${schedules.isEmpty()}"><td colspan="7" class="empty">暂无定时任务。</td></tr>
      </tbody>
    </table>
    </section>

    <form id="schedule-form" class="run-form schedule-form" th:attr="data-selected-chain=${chainId}">
    <section class="panel form-main">
      <div class="panel-title">
        <h2>新建定时任务</h2>
      </div>
      <label for="chainId">链路</label>
      <select id="chainId" name="chainId">
        <option th:each="chain : ${chains}" th:value="${chain}" th:text="${@consoleText.chain(chain)}" th:selected="${chain == chainId}">链路</option>
      </select>

      <div class="form-row">
        <label for="mode">模式
          <select id="mode" name="mode">
            <option value="full">全量</option>
            <option value="rerun">重跑</option>
          </select>
        </label>
        <label for="rerunType">重跑类型
          <select id="rerunType" name="rerunType">
            <option th:each="type : ${rerunTypes}" th:value="${type.value()}" th:text="${type.label()}">重跑类型</option>
          </select>
        </label>
        <label for="rerunId">重跑编号
          <input id="rerunId" name="rerunId" placeholder="多个编号用英文逗号分隔">
        </label>
        <label for="runDate">运行日期
          <input id="runDate" name="runDate" type="date">
        </label>
      </div>

      <section class="config-editor" aria-labelledby="chain-config-title">
        <div class="panel-title">
          <div>
            <h2 id="chain-config-title">链路配置</h2>
            <p id="chain-config-description"></p>
          </div>
        </div>
        <div id="chain-config-fields" class="config-fields"></div>
      </section>
    </section>

    <aside class="panel submit-panel">
      <h2>执行频率</h2>
      <label for="frequency">频率
        <select id="frequency" name="frequency">
          <option value="daily">每天</option>
          <option value="weekly">每周</option>
          <option value="once">一次性</option>
        </select>
      </label>
      <label for="dayOfWeek" class="schedule-weekly-field">星期
        <select id="dayOfWeek" name="dayOfWeek">
          <option value="1">周一</option>
          <option value="2">周二</option>
          <option value="3">周三</option>
          <option value="4">周四</option>
          <option value="5">周五</option>
          <option value="6">周六</option>
          <option value="7">周日</option>
        </select>
      </label>
      <label for="scheduleTime" class="schedule-time-field">执行时间
        <input id="scheduleTime" name="scheduleTime" type="time" value="06:00">
      </label>
      <label for="runAt" class="schedule-once-field">执行日期时间
        <input id="runAt" name="runAt" type="datetime-local">
      </label>
      <label class="checkbox-row" for="enabled">
        <input id="enabled" name="enabled" type="checkbox" checked>
        <span>创建后立即启用</span>
      </label>
      <button class="button primary" type="submit">保存定时任务</button>
      <p id="schedule-result" class="form-message"></p>
    </aside>
    </form>
    </div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
