<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('AgentBridge 任务控制台')}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>
  <main class="app-main">
    <header th:replace="~{fragments/layout :: pageHeader('运行管理', 'AgentBridge 任务控制台', '单个工作流运行，后续提交排队，运行历史持久保存。')}"></header>
    <div class="page-content">

    <section class="metrics">
    <article><span>今日运行</span><strong th:text="${summary.todayRuns}">0</strong></article>
    <article><span>运行中</span><strong th:text="${summary.running}">0</strong></article>
    <article><span>排队中</span><strong th:text="${summary.queued}">0</strong></article>
    <article><span>近 7 天成功率</span><strong th:text="${summary.successRatePercent + '%'}">0%</strong></article>
    <article><span>已成功</span><strong th:text="${summary.succeeded}">0</strong></article>
    <article><span>已失败</span><strong th:text="${summary.failed}">0</strong></article>
    </section>

    <section class="dashboard-grid">
    <article class="panel">
      <div class="panel-title">
        <h2>最近运行</h2>
        <a href="/history">查看全部</a>
      </div>
      <table>
        <thead>
        <tr><th>编号</th><th>链路</th><th>模式</th><th>状态</th><th>创建时间</th></tr>
        </thead>
        <tbody>
        <tr th:each="run,iter : ${runs}" th:if="${iter.index < 8}">
          <td><a th:href="@{/runs/{id}(id=${run.id})}" th:text="${run.id}">1</a></td>
          <td th:text="${@consoleText.chain(run.chainId)}">链路</td>
          <td th:text="${@consoleText.mode(run.mode)}">全量</td>
          <td><span class="status-badge" th:classappend="${run.state.name().toLowerCase()}" th:text="${@consoleText.state(run.state)}">排队中</span></td>
          <td th:text="${run.createdAt}">时间</td>
        </tr>
        <tr th:if="${runs.isEmpty()}"><td colspan="5" class="empty">暂无运行记录。</td></tr>
        </tbody>
      </table>
    </article>

    <aside class="panel">
      <div class="panel-title">
        <h2>需要关注</h2>
      </div>
      <ol class="event-list">
        <li th:each="run : ${summary.attentionRuns}">
          <time th:text="${run.createdAt}">时间</time>
          <strong><a th:href="@{/runs/{id}(id=${run.id})}" th:text="${'运行 ' + run.id}">运行</a></strong>
          <span th:text="${run.failureMessage ?: '未记录失败原因'}">失败原因</span>
        </li>
        <li th:if="${summary.attentionRuns.isEmpty()}"><span class="empty">暂无失败运行。</span></li>
      </ol>
      <div class="panel-title">
        <h2>快速开始</h2>
      </div>
      <div class="chain-list">
        <a th:each="chain : ${chains}" th:href="@{/runs/new(chainId=${chain})}">
          <strong th:text="${@consoleText.chain(chain)}">链路</strong>
          <span>配置并加入队列</span>
        </a>
      </div>
    </aside>
    </section>
    </div>
  </main>
</div>
</body>
</html>
