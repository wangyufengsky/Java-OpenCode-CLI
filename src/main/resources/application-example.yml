agentbridge-runner:
  enabled: false
  # 可选值：git-code-contribution-report, smartesb-rewrite-code-review, smartesb-code-reader, weekly-engineering-report, project-unit-test-generation, mybatis-sql-review
  active-chain: "git-code-contribution-report"
  mode: "full"
  run-date:
  config-dir: "classpath:chains"
  rerun:
    # git-code-contribution-report: author | synthesis
    # smartesb: transaction | module | index
    # weekly-engineering-report: review-batch | synthesis
    # project-unit-test-generation: test-batch | verification
    # mybatis-sql-review: sql | xml | index
    # 多个 author/transaction/statement key/mapper key 用英文逗号放在同一个字符串中；index 不需要 id。
    type:
    id:
  agentbridge:
    web-base-url: "https://127.0.0.1:9642"
    mcp-url: "http://127.0.0.1:8642/mcp"
    concurrency: 1
    max-concurrency: 1
    timeout-minutes: 40
    poll-millis: 1000
    validation-settle-seconds: 30
    validation-max-corrections: 2

task-console:
  database-path: "data/agentbridge-task-console.sqlite"
  run-config-dir: "data/run-configs"
