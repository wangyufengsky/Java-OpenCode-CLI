# SmartESB 8583 -> JSON 重构审查链路配置。
# 只保留 Java 运行时当前会读取的字段；交易清单放在 transaction-plan-dir 下的 yyyy-MM-dd/transactions.yml。

# 必填。报告中的逻辑输出目录；会在其下按运行日期创建子目录。
out: "/home/wangyufeng/review-output/smartesb-rewrite-review"

# 可选。本机实际落盘目录；为空时直接使用 out。用于 Windows 逻辑路径在本机镜像输出。
local-out:

# 必填。每日交易计划目录。
transaction-plan-dir: "src/main/resources/smartesb-transactions"

# 必填。新 JSON 项目根目录，也是 OpenCode session directory。
new-project: "/home/wangyufeng/upfs-nl-json"

# 必填。老 8583/老代码详细设计文档；允许通过 explore 读取当前交易相关片段，但禁止读取 old_project 源码。
old-8583-doc: "/home/wangyufeng/upfs-nl-json/doc/docment/old-8583.md"

# 必填。文档根目录；mapping-doc 或 reconstructed-design 为空时用它拼默认文档路径。
doc-root: "/home/wangyufeng/upfs-nl-json/doc/docment"

# 可选。8583 到 JSON 映射文档；为空时默认 doc-root/8583 to json.md。
mapping-doc:

# 可选。重构项目详细设计；为空时默认 doc-root/重构项目详细设计文档.md。
reconstructed-design:

# 必填。发送给单项 OpenCode session 的附加执行消息。
worker-message: "严格执行附件 worker-prompt.md 中的 SmartESB 单项审查任务，只输出 DONE 或 BLOCKED。"

# 必填。发送给汇总 OpenCode session 的附加执行消息。
synthesis-message: "严格执行附件 synthesis-prompt.md 中的 SmartESB 汇总任务，生成中文 index.md 和 summary.md。"
