# 项目单元测试生成链路。默认全量扫描 src/main/java；source.package-paths 非空时仅处理指定包路径下所有类。
# 链路按顺序执行，每个 task 只包含一个 Java 顶层类型，一个 agent 只写一个类的单元测试。

project:
  id: "example-project"
  name: "Example Project"
  repo: "CHANGE_ME_PROJECT_REPO"

paths:
  out: "project-unit-tests/example-project"

docs:
  agents: "AGENTS.md"
  project-map: "project-map.md"
  reconstructed-design: "重构项目详细设计文档.md"

source:
  package-paths: []
  include: []
  exclude:
    - "target/**"
    - "build/**"
    - "generated/**"
    - "**/target/**"
    - "**/build/**"
    - "**/generated/**"

test:
  coverage-threshold-percent: 90

agentbridge:
  web-base-url: "https://127.0.0.1:9642"
  mcp-url: "http://127.0.0.1:8642/mcp"
  timeout-minutes: 40
  max-attempts: 5
